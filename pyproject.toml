[project]
name = "geo-authority-auditor"
version = "0.1.0"
description = "FastAPI prototype for generative engine optimization audits using OpenAI."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "openai>=1.66.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]
postgres = [
    "psycopg[binary]>=3.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
